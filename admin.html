<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Claims</title><style>body{background:#000;color:#fff;font-family:system-ui;padding:16px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #333;padding:8px;text-align:center;font-size:13px}th{background:#FFD700;color:#000}h2{color:#FFD700;text-align:center}.box{background:#111;border:1px solid #222;border-radius:10px;padding:12px;text-align:center;margin-bottom:12px}</style></head><body><h2>🔐 TEOS Admin - CLAIMS</h2><div class="box"><b id="count">0 Claims</b><br><small>https://elmahrosa.github.io/teos-node/admin.html</small></div><table id="t"><tr><th>Name</th><th>Time</th><th>Source</th></tr></table><div style="text-align:center;margin-top:12px"><button onclick="if(confirm('Clear all?')){localStorage.clear();location.reload()}" style="background:#f33;color:#fff;border:0;padding:8px 14px;border-radius:6px">Clear All</button> <a href="./" style="background:#222;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none">Back to Market</a></div><script>let c=JSON.parse(localStorage.getItem('teos_claims')||'[]');document.getElementById('count').textContent=c.length+' Claims - 600 CLOSED EMPIRE';let tbl=document.getElementById('t');c.slice().reverse().forEach(x=>{let r=tbl.insertRow(1);r.insertCell(0).textContent=x.name;r.insertCell(1).textContent=x.time;r.insertCell(2).textContent='FREE CLAIM';});if(c.length==0){let r=tbl.insertRow(1);let cc=r.insertCell();cc.colSpan=3;cc.textContent='No claims yet - open market and CLAIM';}</script></body></html>
